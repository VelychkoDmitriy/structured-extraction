data_dir: data
results_dir: results
workers: 4            # parallel requests per run

models:
  gpt-4o-mini:
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    structured: json_schema          # provider-side strict JSON Schema
    timeout_s: 60
    max_retries: 3
    price_per_1m: {input: 0.15, output: 0.60}    # USD, openai.com/api/pricing

  gpt-4.1-mini:
    model: gpt-4.1-mini
    api_key_env: OPENAI_API_KEY
    structured: json_schema
    timeout_s: 60
    max_retries: 3
    price_per_1m: {input: 0.40, output: 1.60}    # USD, openai.com/api/pricing

  qwen-local:
    model: qwen2.5-3b-8k                  # qwen2.5:3b + num_ctx 8192, see ollama/Modelfile
    base_url: http://localhost:11434/v1   # Ollama, OpenAI-compatible endpoint, no API key
    structured: json_schema               # Ollama turns the schema into a grammar
    timeout_s: 300
    max_retries: 1
    price_per_1m: {input: 0, output: 0}   # runs on the laptop: no API cost
    workers: 1                            # Ollama answers one request at a time; parallel calls would only add queue time to latency
    grid_prompts: [v2]                    # v1 vs v2 is already compared on the API models
    grid_split: golden                  # ~40 s per resume on a GTX 1650 Ti: the grid runs it on golden only

  claude-haiku:
    model: anthropic/claude-haiku-5.5    # via OpenRouter (OpenAI-compatible endpoint)
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    structured: json_schema
    timeout_s: 90
    max_retries: 3
    price_per_1m: {input: 0.10, output: 0.50}    # USD, openrouter.ai/anthropic/claude-haiku-5.5

  gemini-flash-lite:
    model: google/gemini-3.1-flash-lite
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    structured: json_schema
    timeout_s: 90
    max_retries: 3
    price_per_1m: {input: 0.25, output: 1.50}    # USD, openrouter.ai/google/gemini-3.1-flash-lite

sampling:
  A: {temperature: 0.0, top_p: 1.0}   # deterministic
  B: {temperature: 0.7, top_p: 0.9}   # varied

grid:                 # what `python main.py` runs
  models: [gpt-4.1-mini, claude-haiku, qwen-local]   # gpt-4o-mini, gemini-flash-lite: extra runs, kept in results/
  prompts: [v1, v2]
  sampling: [A, B]
